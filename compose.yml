services:
  migrate:
    build:
      context: ./backend
      target: migration
    environment:
      DATABASE_URL: file:/data/quiz.db
    volumes:
      - quiz-data:/data
    restart: no

  backend:
    build: ./backend
    environment:
      BACKUP_DIRECTORY: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      DATABASE_URL: file:/data/quiz.db
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS}
      PERGUNTAS_CSV_URL: ${PERGUNTAS_CSV_URL:?Defina PERGUNTAS_CSV_URL}
      PERGUNTAS_TIMEOUT_MS: ${PERGUNTAS_TIMEOUT_MS:-10000}
      TRUST_PROXY: 1
      QUIZ_CONTEXT_SECRET: ${QUIZ_CONTEXT_SECRET:?Defina QUIZ_CONTEXT_SECRET}
      PERGUNTAS_ADMIN_TOKEN: ${PERGUNTAS_ADMIN_TOKEN:?Defina PERGUNTAS_ADMIN_TOKEN}
    volumes:
      - quiz-data:/data
      - ./backups:/backups
      - ./shared:/shared:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    environment:
      BACKEND_URL: http://backend:3001
    ports:
      - '${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quiz-data:
