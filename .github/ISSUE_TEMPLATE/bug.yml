name: Relatar um problema
description: Informe um comportamento reproduzivel que precisa ser corrigido.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Obrigado pelo relato. Nao publique segredos ou dados pessoais.
  - type: input
    id: version
    attributes:
      label: Versao
      description: Tag, commit ou data aproximada.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Navegador, sistema e forma de execucao.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Acesse...\n2. Selecione...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
      description: Inclua o X-Request-ID, se houver.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Verificacoes
      options:
        - label: Procurei issues existentes.
          required: true
        - label: Removi segredos e dados pessoais.
          required: true
